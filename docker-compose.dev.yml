services:
  admin-dashboard-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nuxt-frontend-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Bind mount source code dari host ke container agar perubahan terdeteksi otomatis
      - .:/app
      # Anonymous volume agar node_modules & .nuxt di dalam container tidak tertimpa oleh host
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3000
      - API_BASE=http://host.docker.internal:4000
      - NUXT_BACKEND_URL=http://host.docker.internal:4000
      - NUXT_PUBLIC_APP_NAME=${NUXT_PUBLIC_APP_NAME:-APLIKASI SAYA}
    extra_hosts:
      - "host.docker.internal:host-gateway"
