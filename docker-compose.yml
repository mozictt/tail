services:
  admin-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuxt-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - API_BASE=${API_BASE:-http://host.docker.internal:4000}
      - NUXT_BACKEND_URL=${API_BASE:-http://host.docker.internal:4000}
      - NUXT_PUBLIC_APP_NAME=${NUXT_PUBLIC_APP_NAME:-APLIKASI SAYA}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
